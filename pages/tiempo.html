<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroControl - Gestión de Tiempo</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/tiempo.css">
  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">RetroControl</h1>
      <span class="header-title">Gestión de Tiempo</span>
    </header>

    <div class="main-container">
      <aside class="sidebar">
        <nav class="nav">
          <a href="../index.html" class="nav-btn">Inicio</a>
          <a href="tiempo.html" class="nav-btn active">Gestión Tiempo</a>
        </nav>
      </aside>

      <main class="content">
        <div class="equipos-header">
          <span class="equipos-title">Equipos</span>
          <button class="btn-add" id="btnAddEquipo">
            <ion-icon name="add-outline"></ion-icon> Añadir
          </button>
        </div>
        <div class="equipos-list" id="equiposList"></div>
      </main>

      <!-- Historial a la DERECHA -->
      <aside class="historial-sidebar" id="historialSidebar">
        <div class="historial-header">
          <span class="historial-title">
            <ion-icon name="time-outline"></ion-icon> Historial
          </span>
          <button class="btn-clear-historial" id="btnClearHistorial" title="Limpiar historial">
            <ion-icon name="trash-outline"></ion-icon>
          </button>
        </div>
        <div class="historial-list" id="historialList"></div>
      </aside>
    </div>
  </div>

  <button class="fab-config" id="fabConfig" title="Herramientas">
    <ion-icon name="settings-outline"></ion-icon>
  </button>

  <div class="tools-menu" id="toolsMenu" hidden>
    <button class="tools-menu-item" id="btnMenuPrecio" type="button">
      <ion-icon name="cash-outline"></ion-icon>
      <span>Ajustar precio</span>
    </button>
    <button class="tools-menu-item" id="btnMenuCalc" type="button">
      <ion-icon name="calculator-outline"></ion-icon>
      <span>Calculadora</span>
    </button>
  </div>

  <div class="price-panel" id="pricePanel" hidden>
    <div class="price-panel-inner">
      <span class="price-label">Ajuste de Precio</span>
      <div class="price-fields">
        <input type="number" id="priceAmount" min="0" step="1" value="30" class="price-input">
        <span>por</span>
        <input type="number" id="pricePer" min="1" step="1" value="30" class="price-input price-per">
        <select id="priceUnit" class="price-select">
          <option value="minutos">MINUTOS</option>
          <option value="horas">HORAS</option>
        </select>
      </div>
      <button class="btn-price-save" id="btnSavePrice">Guardar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalCalc" hidden>
    <div class="modal modal-calc">
      <h3 class="modal-title">Calculadora</h3>
      <div class="calc-display" id="calcDisplay">0</div>
      <div class="calc-grid">
        <button type="button" class="calc-btn" data-calc="C">C</button>
        <button type="button" class="calc-btn" data-calc="±">±</button>
        <button type="button" class="calc-btn" data-calc="%">%</button>
        <button type="button" class="calc-btn calc-op" data-calc="/">÷</button>
        <button type="button" class="calc-btn" data-calc="7">7</button>
        <button type="button" class="calc-btn" data-calc="8">8</button>
        <button type="button" class="calc-btn" data-calc="9">9</button>
        <button type="button" class="calc-btn calc-op" data-calc="*">×</button>
        <button type="button" class="calc-btn" data-calc="4">4</button>
        <button type="button" class="calc-btn" data-calc="5">5</button>
        <button type="button" class="calc-btn" data-calc="6">6</button>
        <button type="button" class="calc-btn calc-op" data-calc="-">−</button>
        <button type="button" class="calc-btn" data-calc="1">1</button>
        <button type="button" class="calc-btn" data-calc="2">2</button>
        <button type="button" class="calc-btn" data-calc="3">3</button>
        <button type="button" class="calc-btn calc-op" data-calc="+">+</button>
        <button type="button" class="calc-btn calc-zero" data-calc="0">0</button>
        <button type="button" class="calc-btn" data-calc=".">.</button>
        <button type="button" class="calc-btn calc-eq" data-calc="=">=</button>
      </div>
      <button class="modal-btn modal-btn-cancel" id="btnCerrarCalc" type="button">Cerrar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalNuevoEquipo" hidden>
    <div class="modal">
      <h3 class="modal-title" id="modalEquipoTitle">Nuevo Equipo</h3>
      <div class="modal-body">
        <label class="modal-label">Nombre:</label>
        <input type="text" id="inputNombre" class="modal-input" placeholder="Ej: XBOX 1" autocomplete="off">
        <label class="modal-label">Tipo:</label>
        <select id="inputTipo" class="modal-select">
          <option value="PC">PC</option>
          <option value="XBOX">XBOX</option>
          <option value="PLAYSTATION">PLAYSTATION</option>
        </select>
      </div>
      <button class="modal-btn" id="btnAceptarNuevo">Aceptar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalTiempo" hidden>
    <div class="modal">
      <h3 class="modal-title" id="modalTiempoTitle">Tiempo Definido</h3>
      <div class="modal-body modal-body-row">
        <input type="number" id="inputTiempoValor" class="modal-input modal-input-num" min="0" value="0">
        <select id="inputTiempoUnidad" class="modal-select modal-select-sm">
          <option value="minutos">Minutos</option>
          <option value="horas">Horas</option>
        </select>
      </div>
      <button class="modal-btn" id="btnAceptarTiempo">Aceptar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalCobrar" hidden>
    <div class="modal modal-cobrar">
      <h3 class="modal-title">Cobrar</h3>
      <div class="modal-body">
        <p class="cobrar-info" id="cobrarInfo">Tiempo utilizado: 00:00:00</p>
        <p class="cobrar-base" id="cobrarBase">Tiempo: $0.00</p>
        <label class="modal-label">Extra (copias, abarrotes, etc.):</label>
        <div class="extra-row">
          <span>$</span>
          <input type="number" id="inputExtra" class="modal-input modal-input-num" min="0" step="0.01" value="0">
        </div>
        <p class="cobrar-total" id="cobrarTotal">Total a cobrar: $0.00</p>
      </div>
      <button class="modal-btn" id="btnConfirmarCobrar">Cobrar</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalConfirm" hidden>
    <div class="modal">
      <h3 class="modal-title" id="confirmTitle">¿Estás seguro?</h3>
      <div class="modal-body">
        <p class="confirm-text" id="confirmText">Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="btnConfirmNo">No</button>
        <button class="modal-btn" id="btnConfirmSi">Sí</button>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/tiempo.js"></script>
</body>
</html>
